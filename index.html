<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VE Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>VE Calculator</h1>

<div class="card">
  <h3>Logs</h3>
  <input type="file" id="loadLog" multiple>
  <button id="showCoverage">Show Log Coverage</button>
</div>

<div class="card">
  <h3>Manual VE Input</h3>

  <label>RPM Axis</label>
  <textarea id="rpmAxis"></textarea>

  <label>MAP Axis (psi)</label>
  <textarea id="mapAxis"></textarea>

  <label>VE Table</label>
  <textarea id="veTable"></textarea>

  <button id="loadManualVE">Load VE</button>
</div>

<div class="card">
  <label>Interpolation</label>
  <select id="mode">
    <option value="off">Off</option>
    <option value="soft">Soft</option>
    <option value="hard">Hard</option>
    <option value="engine">Engine (recommended)</option>
  </select>

  <label style="margin-left: 20px;">Min Samples</label>
  <input type="number" id="minSamples" value="3" min="1" max="50"
    style="width:60px; margin-left:8px; padding:5px; border-radius:6px; border:1px solid #ccc;">
</div>

<div class="card" style="display:flex; gap:10px;">
  <button id="calculate">Calculate VE</button>
  <button id="exportBtn" style="background:#28a745;">Export VE (RomRaider)</button>
</div>

<div id="output"></div>

<script type="module" src="app.js"></script>

</body>
</html>
