<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VE Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>VE Calculator</h1>

<!-- LOG -->
<div class="card">
  <h3>Logs</h3>
  <input type="file" id="loadLog" multiple>
  <div style="margin-top:10px;">
    <button id="showCoverage">Show Log Coverage</button>
  </div>
</div>

<!-- VE INPUT -->
<div class="card">
  <h3>Manual VE Input</h3>

  <label>RPM Axis</label>
  <textarea id="rpmAxis" placeholder="800 1200 1600 ..."></textarea>

  <label>MAP Axis (psi)</label>
  <textarea id="mapAxis" placeholder="5 7 9 11 13 ..."></textarea>

  <label>VE Table</label>
  <textarea id="veTable" placeholder="69 77 82 ...
65 74 79 ..."></textarea>

  <button id="loadManualVE">Load VE</button>
</div>

<!-- CALC -->
<div class="card">
  <button id="calculate">Calculate VE</button>
</div>

<!-- OUTPUT -->
<div id="output"></div>

<!-- SCRIPT -->
<script type="module" src="app.js"></script>

</body>
</html>
