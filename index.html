<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VE Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>VE Calculator</h1>

<div class="card">
  <h3>Logs</h3>
  <input type="file" id="loadLog" multiple>
  <button id="showCoverage">Show Log Coverage</button>
</div>

<div class="card">
  <h3>Manual VE Input</h3>

  <label>RPM Axis</label>
  <textarea id="rpmAxis"></textarea>

  <label>MAP Axis (psi)</label>
  <textarea id="mapAxis"></textarea>

  <label>VE Table</label>
  <textarea id="veTable"></textarea>

  <button id="loadManualVE">Load VE</button>
</div>

<div class="card">
  <label>Interpolation</label>
  <select id="mode">
    <option value="off">Off</option>
    <option value="soft">Soft</option>
    <option value="hard">Hard</option>
    <option value="engine">Engine (recommended)</option>
  </select>
</div>

<div class="card">
  <button id="calculate">Calculate VE</button>
</div>

<div id="output"></div>

<script type="module" src="app.js"></script>

</body>
</html>
