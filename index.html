<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VE Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <h1>VE Calculator</h1>

  <section>
    <h2>Input</h2>

    <label>
      Log files
      <input type="file" id="loadLog" multiple>
    </label>

    <label>
      VE table
      <input type="file" id="loadVE">
    </label>

    <label>
      TPS cutoff (%)
      <input type="number" id="tpsCutoff" value="4" min="0" max="20" step="0.5">
    </label>

    <label>
      Interpolation
      <select id="interpMode">
        <option value="off">Off</option>
        <option value="soft">Soft</option>
        <option value="medium">Medium</option>
      </select>
    </label>
  </section>

  <section>
    <h2>Diagnostics</h2>
    <pre id="debug">No data loaded</pre>
  </section>

  <section>
    <button id="calculate">Calculate VE</button>
  </section>

  <section id="output"></section>

  <section>
    <button id="export" disabled>Export VE_new.csv</button>
  </section>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
